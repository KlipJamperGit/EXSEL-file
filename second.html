<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Second Newspaper Site</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="hero">
    <h1>Site 2: Газетний перегляд</h1>
    <p>Дані з сайту 1 відкриваються моментально. Можна також додати .xlsx або .exeshnik вручну.</p>
  </header>

  <main>
    <section class="controls">
      <label for="exeshnikFile" class="file-label">Вибрати файл (.xlsx/.xls/.exeshnik/.json)</label>
      <input id="exeshnikFile" type="file" accept=".xlsx,.xls,.exeshnik,.json" />
      <p id="autoStatus" class="hint">Очікуються дані.</p>
    </section>

    <section id="newsGrid" class="news-grid">
      <article class="empty-state">Дані ще не завантажено.</article>
    </section>
  </main>

  <script src="./second.js"></script>
</body>
</html>
